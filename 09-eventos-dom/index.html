<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Callback no clique</title>
    <!-- defer: carrega o JS e espera o HTML ser lido antes de execcuta-lo.-->
     <script src="script.js" defer></script>
</head>
<body>
    <!-- h1 - título principal mostrado na página.-->
     <h1>Meu primeiro evento com callback</h1>
     <!-- id identifica o botao para que o JS posssa encontra-lo-->
      <button id="btn">Acender luz</button>
      <!-- O JS vai mudar o texto deste parágrafo no clique-->
       <p id="status">Luz apagada</p>
</body>
</html>
